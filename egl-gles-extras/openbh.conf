ENABLE_E2EGL = "${@bb.utils.contains_any("MACHINEBUILD", "dual gbip4k gbquad4k gbquad4kpro gbtrio4k gbtrio4kpro gbue4k novaler4kpro pulse4k pulse4kmini sf8008 vuduo4k vuduo4kse vuduo4klite vusolo4k vuultimo4k vuuno4k vuuno4kse vuzero4k zgemmah7 zgemmah8se zgemmah9combose zgemmah9twinse zgemmah11s zgemmah17twin", "1", "0", d)}"

# Suppress skins1440, except on machines that can take a 1440p canvas as is.
# pulse4k/pulse4kmini stay suppressed: the Mali-450 could take it, but hifb
# (/dev/fb0) refuses anything above 1920x1080 (FBIOPUT_VSCREENINFO returns EPERM
# for 2560x1440 and 3840x2160, verified on device). Setting it also keeps
# enigma2.bbappend from adding --enable-egl-canvas-scaling on these machines.
E2EGL_WQHD_FEATURE = "${@bb.utils.contains_any('MACHINEBUILD', 'dual gbip4k gbquad4k gbquad4kpro gbtrio4k gbtrio4kpro gbue4k novaler4kpro sf8008 vuduo4k vuduo4klite vuuno4k vuuno4kse vuzero4k zgemmah7 zgemmah8se zgemmah9combose zgemmah9twinse zgemmah11s zgemmah17twin', 'skins1440', '', d)}"